<style>
  /* alt-sekmeli — Çok bilgiyi küçük alana sığdırır: sütunlar yerine tek panel + sekme şeridi. */
  .modulex-alt-sekmeli { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-alt-sekmeli *, .modulex-alt-sekmeli *::before, .modulex-alt-sekmeli *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-alt-sekmeli :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-alt-sekmeli :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-alt-sekmeli :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-alt-sekmeli :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-alt-sekmeli img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-alt-sekmeli) img { height: auto; }
  .modulex-alt-sekmeli [hidden] { display: none !important; }
  .modulex-alt-sekmeli :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-alt-sekmeli :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-alt-sekmeli-ic { max-width: --max--; margin-inline: auto; }
  .modulex-alt-sekmeli-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-alt-sekmeli--bassiz .modulex-alt-sekmeli-bas { display: none; }
  .modulex-alt-sekmeli-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-alt-sekmeli-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-alt-sekmeli-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-alt-sekmeli-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-alt-sekmeli-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-alt-sekmeli-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-sekmeli-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-alt-sekmeli-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-alt-sekmeli-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-alt-sekmeli-bag { color: inherit; text-decoration: none; transition: color 0.2s ease; }
  .modulex-alt-sekmeli-bag:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-alt-sekmeli-bag[aria-current="page"] { color: --accentInk--; font-weight: 700; }
  .modulex-alt-sekmeli-logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .modulex-alt-sekmeli-logo img { width: auto; max-height: --logoH--; }
  .modulex-alt-sekmeli-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-alt-sekmeli-bbaslik { margin-block-end: 14px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-alt-sekmeli-sayfalar, .modulex-alt-sekmeli-baglantilar, .modulex-alt-sekmeli-iletisim, .modulex-alt-sekmeli-yasal { display: grid; gap: 9px; }
  .modulex-alt-sekmeli-il { display: flex; align-items: flex-start; gap: 10px; }
  .modulex-alt-sekmeli-il-ic { display: grid; gap: 2px; }
  .modulex-alt-sekmeli-il-etiket { color: --muted--; font-size: 0.8rem; }
  .modulex-alt-sekmeli-il-ikon { flex: none; color: --accentInk--; font-size: 20px; }
  .modulex-alt-sekmeli-saatler { display: grid; gap: 6px; }
  .modulex-alt-sekmeli-saat { display: flex; justify-content: space-between; gap: 16px; }
  .modulex-alt-sekmeli-saat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modulex-alt-sekmeli-sosyal { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulex-alt-sekmeli-sosyal-a { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid --cizgi--; border-radius: 50%; color: inherit; font-size: 18px; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-alt-sekmeli-sosyal-a:hover { border-color: --accent--; background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-alt-sekmeli-hakkinda { max-width: 46ch; color: --muted--; }
  .modulex-alt-sekmeli-telif { display: flex; flex-wrap: wrap; gap: 4px 14px; color: --muted--; font-size: 0.9rem; }
  .modulex-alt-sekmeli-dil:empty { display: none; }
  .modulex-alt-sekmeli-yukari { display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 50%; background: --accent--; color: --accentText--; text-decoration: none; transition: transform 0.25s ease; }
  .modulex-alt-sekmeli-yukari:hover { transform: translateY(-3px); }
  .modulex-alt-sekmeli-bulten { display: grid; gap: 8px; }
  .modulex-alt-sekmeli-nl-etiket { font-size: 0.9rem; font-weight: 700; }
  .modulex-alt-sekmeli-nl-satir { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-alt-sekmeli-nl-girdi { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 10px 18px; border: 1px solid --cizgi--; border-radius: 999px; background: --bg--; color: --text--; font: inherit; }
  .modulex-alt-sekmeli-nl-dugme { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 999px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; transition: transform 0.2s ease; }
  .modulex-alt-sekmeli-nl-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-sekmeli-nl-dugme .material-symbols-outlined { font-size: 18px; }
  .modulex-alt-sekmeli-nl-durum:empty { display: none; }
  .modulex-alt-sekmeli-nl-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .modulex-alt-sekmeli-nl-metin { color: --muted--; }

  .modulex-alt-sekmeli-izgara { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
  .modulex-alt-sekmeli-marka { display: grid; gap: 16px; }
  .modulex-alt-sekmeli-sekmeler { display: flex; flex-wrap: wrap; gap: 6px; margin-block-end: 18px; padding: 6px; border-radius: 999px; background: --kartBg--; }
  .modulex-alt-sekmeli:not(.modulex-alt-sekmeli--js) .modulex-alt-sekmeli-sekmeler { display: none; }
  .modulex-alt-sekmeli-sekme { min-height: 42px; padding: 8px 18px; border: 0; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-weight: 700; transition: background 0.25s ease, color 0.25s ease; }
  .modulex-alt-sekmeli-sekme:hover { background: color-mix(in srgb, --accent-- 10%, transparent); }
  .modulex-alt-sekmeli-sekme[aria-selected="true"] { background: --accent--; color: --accentText--; }
  .modulex-alt-sekmeli-panel { padding: clamp(18px, 3vw, 28px); border-radius: --yuvarlak--; background: --kartBg--; animation: modulex-alt-sekmeli-gel 0.35s ease both; }
  .modulex-alt-sekmeli:not(.modulex-alt-sekmeli--js) .modulex-alt-sekmeli-panel + .modulex-alt-sekmeli-panel { margin-block-start: 12px; }
  .modulex-alt-sekmeli--js .modulex-alt-sekmeli-pbaslik { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .modulex-alt-sekmeli-pbaslik { margin-block-end: 12px; color: --accentInk--; font-weight: 800; }
  .modulex-alt-sekmeli-panel :is(.modulex-alt-sekmeli-sayfalar, .modulex-alt-sekmeli-baglantilar) { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  @keyframes modulex-alt-sekmeli-gel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .modulex-alt-sekmeli-alt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-block-start: 36px; padding-block-start: 20px; border-block-start: 1px solid --cizgi--; }
  .modulex-alt-sekmeli-yasal { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  @media (max-width: 1024px) {
    .modulex-alt-sekmeli-izgara { grid-template-columns: minmax(0, 1fr); }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-sekmeli :is(.modulex-alt-sekmeli-baslik, .modulex-alt-sekmeli-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-sekmeli-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-alt-sekmeli { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-alt-sekmeli *, .modulex-alt-sekmeli *::before, .modulex-alt-sekmeli *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-alt-sekmeli";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
