<section class="modulex-iletisim-zaman-cizgisi{{fbsinif}}" {{fbetiket}}>

<style>
  /* iletisim-zaman-cizgisi — Kanalları «adım adım bize ulaşın» akışı gibi sıralar; liste değil bağlı bir hat, sakin ve kurumsal. */
  .modulex-iletisim-zaman-cizgisi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-zaman-cizgisi *, .modulex-iletisim-zaman-cizgisi *::before, .modulex-iletisim-zaman-cizgisi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-zaman-cizgisi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-zaman-cizgisi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-zaman-cizgisi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-zaman-cizgisi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-zaman-cizgisi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-zaman-cizgisi) img { height: auto; }
  .modulex-iletisim-zaman-cizgisi [hidden] { display: none !important; }
  .modulex-iletisim-zaman-cizgisi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-zaman-cizgisi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-zaman-cizgisi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-zaman-cizgisi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-zaman-cizgisi--bassiz .modulex-iletisim-zaman-cizgisi-bas { display: none; }
  .modulex-iletisim-zaman-cizgisi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-zaman-cizgisi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-zaman-cizgisi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-zaman-cizgisi-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-iletisim-zaman-cizgisi-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-iletisim-zaman-cizgisi--bassiz .modulex-iletisim-zaman-cizgisi-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-iletisim-zaman-cizgisi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-zaman-cizgisi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-zaman-cizgisi-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-zaman-cizgisi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-zaman-cizgisi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-zaman-cizgisi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-zaman-cizgisi-hat { position: relative; display: grid; gap: 30px; }
  .modulex-iletisim-zaman-cizgisi-hat::before { content: ""; position: absolute; inset-block: 24px; inset-inline-start: 23px; width: 2px; background: --cizgi--; }
  .modulex-iletisim-zaman-cizgisi-dugum { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 20px; align-items: start; transition: opacity 0.5s ease, transform 0.5s ease; }
  .modulex-iletisim-zaman-cizgisi-dugum .modulex-iletisim-zaman-cizgisi-kikon { position: relative; z-index: 1; border-radius: 50%; background: --bg--; box-shadow: 0 0 0 2px --accent--; }
  .modulex-iletisim-zaman-cizgisi-kgovde { display: grid; gap: 4px; min-width: 0; padding-block-start: 2px; }
  .modulex-iletisim-zaman-cizgisi-dugum .modulex-iletisim-zaman-cizgisi-deger { font-size: 1.15rem; }
  .modulex-iletisim-zaman-cizgisi--hazir:not(.modulex-iletisim-zaman-cizgisi--gor) .modulex-iletisim-zaman-cizgisi-dugum { opacity: 0; transform: translateX(12px); }
  .modulex-iletisim-zaman-cizgisi--gor .modulex-iletisim-zaman-cizgisi-dugum { transition-delay: calc(var(--i, 0) * 90ms); }
  .modulex-iletisim-zaman-cizgisi-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-zaman-cizgisi-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-zaman-cizgisi-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-zaman-cizgisi-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-zaman-cizgisi-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-zaman-cizgisi-eylem:hover { gap: 10px; }
  .modulex-iletisim-zaman-cizgisi-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-zaman-cizgisi-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-zaman-cizgisi--kjs .modulex-iletisim-zaman-cizgisi-kopya { display: inline-flex; }
  .modulex-iletisim-zaman-cizgisi-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-zaman-cizgisi-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-zaman-cizgisi--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-zaman-cizgisi-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-zaman-cizgisi-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-zaman-cizgisi-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-zaman-cizgisi-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-zaman-cizgisi-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-zaman-cizgisi-cikon { font-size: 18px; }
  .modulex-iletisim-zaman-cizgisi-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-zaman-cizgisi-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-zaman-cizgisi-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-zaman-cizgisi-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-zaman-cizgisi-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-zaman-cizgisi-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-zaman-cizgisi-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-zaman-cizgisi-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-zaman-cizgisi-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-zaman-cizgisi :is(.modulex-iletisim-zaman-cizgisi-baslik, .modulex-iletisim-zaman-cizgisi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-zaman-cizgisi-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-iletisim-zaman-cizgisi-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-zaman-cizgisi-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-zaman-cizgisi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-zaman-cizgisi *, .modulex-iletisim-zaman-cizgisi *::before, .modulex-iletisim-zaman-cizgisi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-zaman-cizgisi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
