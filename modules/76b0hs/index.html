<section class="modulex-tanitim-sinema{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-tanitim-sinema-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* tanitim-sinema — Görsel önce gelir (medya baskın, yatay sinema oranı); metin altta gazete gibi iki sütuna bölünür. */
  .modulex-tanitim-sinema { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-tanitim-sinema *, .modulex-tanitim-sinema *::before, .modulex-tanitim-sinema *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-tanitim-sinema :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-tanitim-sinema :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-tanitim-sinema :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-tanitim-sinema :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-tanitim-sinema img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-tanitim-sinema) img { height: auto; }
  .modulex-tanitim-sinema [hidden] { display: none !important; }
  .modulex-tanitim-sinema :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-tanitim-sinema :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-tanitim-sinema-ic { max-width: --max--; margin-inline: auto; }
  .modulex-tanitim-sinema-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-tanitim-sinema--bassiz .modulex-tanitim-sinema-bas { display: none; }
  .modulex-tanitim-sinema-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-tanitim-sinema-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-tanitim-sinema-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-tanitim-sinema-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-tanitim-sinema-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-tanitim-sinema-dugme:hover { transform: translateY(-2px); }
  .modulex-tanitim-sinema-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-tanitim-sinema-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-tanitim-sinema-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-tanitim-sinema-perde { overflow: hidden; margin-block-end: clamp(32px, 5vw, 64px); border-radius: calc(--yuvarlak-- * 1.4); aspect-ratio: 21 / 9; }
  .modulex-tanitim-sinema-gorsel { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform 2.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-tanitim-sinema--gor .modulex-tanitim-sinema-gorsel { transform: scale(1); }
  .modulex-tanitim-sinema-iki { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); }
  .modulex-tanitim-sinema-sol { display: grid; align-content: start; gap: 14px; }
  .modulex-tanitim-sinema-baslik { font-size: clamp(2.2rem, 4.4vw, 3.6rem); }
  .modulex-tanitim-sinema-sag { display: grid; align-content: start; gap: 18px; }
  .modulex-tanitim-sinema-maddeler { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding-block-start: 18px; border-block-start: 1px solid --cizgi--; }
  .modulex-tanitim-sinema-madde { display: grid; gap: 6px; }
  .modulex-tanitim-sinema-mikon { color: --accentInk--; font-size: 26px; }
  @media (max-width: 768px) {
    .modulex-tanitim-sinema-iki, .modulex-tanitim-sinema-maddeler { grid-template-columns: minmax(0, 1fr); }
    .modulex-tanitim-sinema-perde { aspect-ratio: 4 / 3; }
  }
  .modulex-tanitim-sinema-bag { color: inherit; text-decoration: none; }
  .modulex-tanitim-sinema-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-tanitim-sinema-mbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-tanitim-sinema-mmetin { color: --muted--; font-size: 0.95rem; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-sinema :is(.modulex-tanitim-sinema-baslik, .modulex-tanitim-sinema-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-sinema-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-tanitim-sinema { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-tanitim-sinema *, .modulex-tanitim-sinema *::before, .modulex-tanitim-sinema *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-tanitim-sinema";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
