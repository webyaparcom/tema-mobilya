<section class="modulex-sss-sohbet{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sss-sohbet-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sss-sohbet — Mesajlaşma metaforu: sıcak, konuşur gibi bir SSS; balonlar RTL'de kendiliğinden yer değiştirir. */
  .modulex-sss-sohbet { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-sohbet *, .modulex-sss-sohbet *::before, .modulex-sss-sohbet *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-sohbet :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-sohbet :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-sohbet :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-sohbet :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-sohbet img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-sohbet) img { height: auto; }
  .modulex-sss-sohbet [hidden] { display: none !important; }
  .modulex-sss-sohbet :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-sohbet :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-sohbet-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-sohbet-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sss-sohbet--bassiz .modulex-sss-sohbet-bas { display: none; }
  .modulex-sss-sohbet-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sss-sohbet-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-sohbet-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-sohbet-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sss-sohbet-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-sohbet-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sss-sohbet-dugme:hover { transform: translateY(-2px); }
  .modulex-sss-sohbet-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-sohbet-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-sohbet-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-sohbet-akis { display: grid; gap: 28px; }
  .modulex-sss-sohbet-cift { display: grid; gap: 10px; transition: opacity 0.5s ease, transform 0.5s ease; transition-delay: calc(var(--i) * 80ms); }
  .modulex-sss-sohbet--hazir:not(.modulex-sss-sohbet--gor) .modulex-sss-sohbet-cift { opacity: 0; transform: translateY(14px); }
  .modulex-sss-sohbet-soru-balon { justify-self: end; max-width: min(78%, 560px); padding: 14px 20px; border-radius: 22px 22px 6px 22px; background: --vurguBg--; color: --vurguText--; font-weight: 650; line-height: 1.45; }
  .modulex-sss-sohbet-yanit-satir { display: flex; align-items: flex-end; gap: 12px; max-width: min(86%, 640px); }
  .modulex-sss-sohbet-avatar { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; background: --kartBg--; color: --accentInk--; font-size: 22px; border: 1px solid --cizgi--; }
  .modulex-sss-sohbet-yanit-balon { padding: 14px 20px; border-radius: 22px 22px 22px 6px; background: --kartBg--; border: 1px solid --cizgi--; }
  .modulex-sss-sohbet-cevap { color: --text--; line-height: 1.65; }
  :is([dir="rtl"]) .modulex-sss-sohbet-soru-balon { border-radius: 22px 22px 22px 6px; }
  :is([dir="rtl"]) .modulex-sss-sohbet-yanit-balon { border-radius: 22px 22px 6px 22px; }
  @media (max-width: 768px) {
    .modulex-sss-sohbet-soru-balon { max-width: 90%; }
    .modulex-sss-sohbet-yanit-satir { max-width: 100%; }
    .modulex-sss-sohbet-avatar { width: 32px; height: 32px; font-size: 18px; }
  }
  .modulex-sss-sohbet-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-sohbet-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-sohbet-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-sohbet :is(.modulex-sss-sohbet-baslik, .modulex-sss-sohbet-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-sohbet-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sss-sohbet { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-sohbet *, .modulex-sss-sohbet *::before, .modulex-sss-sohbet *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sss-sohbet";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
