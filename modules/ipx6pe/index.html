<style>
  /* deger-sekme — Tüm değerleri aynı anda dizmek yerine tek tek odaklar (sekme etkileşimi); uzun açıklamalı değer setleri için. */
  .modulex-deger-sekme { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-sekme *, .modulex-deger-sekme *::before, .modulex-deger-sekme *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-sekme :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-deger-sekme :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-deger-sekme :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-deger-sekme :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-deger-sekme img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-deger-sekme) img { height: auto; }
  .modulex-deger-sekme [hidden] { display: none !important; }
  .modulex-deger-sekme :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-deger-sekme :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-deger-sekme-ic { max-width: --max--; margin-inline: auto; }
  .modulex-deger-sekme-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-deger-sekme--bassiz .modulex-deger-sekme-bas { display: none; }
  .modulex-deger-sekme-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-deger-sekme-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-deger-sekme-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-deger-sekme-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-deger-sekme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-sekme-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-deger-sekme-dugme:hover { transform: translateY(-2px); }
  .modulex-deger-sekme-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-deger-sekme-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-deger-sekme-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-sekme-duzen { display: grid; grid-template-columns: minmax(220px, 0.8fr) minmax(0, 2fr); gap: clamp(20px, 3vw, 40px); }
  .modulex-deger-sekme:not(.modulex-deger-sekme--js) .modulex-deger-sekme-sekmeler { display: none; }
  .modulex-deger-sekme:not(.modulex-deger-sekme--js) .modulex-deger-sekme-duzen { grid-template-columns: minmax(0, 1fr); }
  .modulex-deger-sekme-sekmeler { display: grid; align-content: start; gap: 8px; }
  .modulex-deger-sekme-sekme { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px; border: 1px solid transparent; border-radius: 14px; background: transparent; color: --muted--; font: inherit; font-weight: 650; text-align: start; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-deger-sekme-sekme:hover { color: --text--; border-color: --cizgi--; }
  .modulex-deger-sekme-sekme[aria-selected="true"] { background: --kartBg--; color: --text--; border-color: --cizgi--; box-shadow: 0 10px 24px -20px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-deger-sekme-sikon { color: --accentInk--; font-size: 22px; }
  .modulex-deger-sekme-paneller { display: grid; gap: 16px; }
  .modulex-deger-sekme-panel { position: relative; display: grid; gap: 24px; align-items: center; min-height: 320px; padding: clamp(24px, 4vw, 48px); border-radius: --yuvarlak--; background: --kartBg--; animation: modulex-deger-sekme-gel 0.4s ease both; }
  .modulex-deger-sekme-panel--gorsel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .modulex-deger-sekme-panel-yazi { display: grid; gap: 12px; align-content: center; }
  .modulex-deger-sekme-ikon { display: inline-grid; place-items: center; width: 72px; height: 72px; border-radius: 22px; background: --vurguBg--; color: --vurguText--; font-size: 38px; }
  .modulex-deger-sekme-etiket { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-deger-sekme-kbaslik { font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 750; }
  .modulex-deger-sekme-kmetin { color: --muted--; font-size: 1.05rem; line-height: 1.75; }
  .modulex-deger-sekme-gorsel { width: 100%; height: 100%; max-height: 360px; object-fit: cover; border-radius: calc(--yuvarlak-- * 0.7); }
  @keyframes modulex-deger-sekme-gel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-deger-sekme-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-deger-sekme-sekmeler { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; scrollbar-width: none; }
    .modulex-deger-sekme-panel--gorsel { grid-template-columns: minmax(0, 1fr); }
    .modulex-deger-sekme-panel { min-height: 0; }
  }
  .modulex-deger-sekme-bag { color: inherit; text-decoration: none; }
  .modulex-deger-sekme-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-sekme-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-sekme :is(.modulex-deger-sekme-baslik, .modulex-deger-sekme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-sekme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-deger-sekme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-sekme *, .modulex-deger-sekme *::before, .modulex-deger-sekme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-sekme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
